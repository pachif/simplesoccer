<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>WORLD CUP SOCCER — Retro Remake</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/press-start-2p@latest/index.css"/>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#151515,#000 75%)}
  #frame{position:relative}
  canvas#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.25) 0 1px,transparent 1px 3px);opacity:.55}
  #vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(0,0,0,.9);border-radius:6px}
  #touch{position:absolute;inset:0;pointer-events:none;display:none;justify-content:space-between;align-items:flex-end;padding:10px;box-sizing:border-box}
  @media (pointer:coarse){#touch{display:flex}}
  #dpad{display:grid;grid-template-areas:". u ." "l . r" ". d .";gap:4px;pointer-events:auto}
  #dpad button{width:52px;height:52px;font-size:16px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:8px}
  #ab{display:flex;gap:8px;align-items:flex-end;pointer-events:auto}
  #ab button{width:56px;height:56px;border-radius:50%;font-family:'Press Start 2P',monospace;font-size:14px;color:#fff;border:2px solid rgba(255,255,255,.4)}
  #ab button[data-k="A"]{background:rgba(224,32,64,.55)}
  #ab button[data-k="B"]{background:rgba(32,80,200,.55)}
  #ab button[data-k="start"]{width:40px;height:40px;background:rgba(255,255,255,.2);font-size:10px}
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <canvas id="game" width="480" height="426"></canvas>
    <div id="scan"></div><div id="vig"></div>
    <div id="touch">
      <div id="dpad">
        <button data-k="up" style="grid-area:u">▲</button>
        <button data-k="left" style="grid-area:l">◀</button>
        <button data-k="right" style="grid-area:r">▶</button>
        <button data-k="down" style="grid-area:d">▼</button>
      </div>
      <div id="ab">
        <button data-k="start">⏎</button>
        <button data-k="B">B</button>
        <button data-k="A">A</button>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ================= CONSTANTS (GDD spec) ================= */
const W=480,H=426,PW=480,PH=1280,CX=240;          // pitch 480x1280, viewport = 1/3
const GT=24,GB=PH-24,GOAL_HW=65;                  // goal lines & half width
const MATCH_LEN=120;                              // 2 min arcade match
const PR=7;                                       // player body radius: ONE constant -> identical sprite size for every player & difficulty
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const frame=document.getElementById('frame');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const norm=(x,y)=>{const d=Math.hypot(x,y)||1;return{x:x/d,y:y/d};};

/* ================= CPU DIFFICULTY LEVELS (AI brain only, never sprite size) ================= */
const DIFFS=[
 {name:'LOW',     spd:.82, react:.45, avoid:.4,  lead:.05, steal:.25, err:1.5, range:210, gk:13},
 {name:'AVERAGE', spd:1.0, react:1.0, avoid:.9,  lead:.15, steal:.45, err:1.0, range:260, gk:17},
 {name:'HIGH',    spd:1.12,react:1.6, avoid:1.2, lead:.25, steal:.62, err:.6,  range:300, gk:20}
];
let diffIdx=1, menuCur=0;

/* ================= TEAMS (8 nations, home + AWAY kits) ================= */
const TEAMS=[
 {name:'BRAZIL', short:'BRA',shirt:'#ffd800',trim:'#003da5',alt:'#2050c0',altTrim:'#ffd800',hair:'#2e1a0c',spd:1.06,pow:1.05,def:0.95,flag:'bra'},
 {name:'W.GERMANY',short:'FRG',shirt:'#f0f0f0',trim:'#202020',alt:'#007840',altTrim:'#ffffff',hair:'#8a5a20',spd:0.98,pow:1.00,def:1.10,flag:'frg'},
 {name:'ARGENTINA',short:'ARG',shirt:'#79b7ff',trim:'#ffffff',alt:'#203060',altTrim:'#ffffff',hair:'#3a2a1a',spd:1.02,pow:1.00,def:1.00,flag:'arg'},
 {name:'ITALY',  short:'ITA',shirt:'#1e50a0',trim:'#ffffff',alt:'#f0f0f0',altTrim:'#1e50a0',hair:'#1a1a1a',spd:0.96,pow:0.95,def:1.12,flag:'ita'},
 {name:'ENGLAND',short:'ENG',shirt:'#ffffff',trim:'#d02020',alt:'#d02020',altTrim:'#ffffff',hair:'#5a3a1a',spd:1.00,pow:1.02,def:1.02,flag:'eng'},
 {name:'FRANCE', short:'FRA',shirt:'#2040a0',trim:'#ffffff',alt:'#f0f0f0',altTrim:'#2040a0',hair:'#2a1a0a',spd:1.08,pow:0.98,def:0.94,flag:'fra'},
 {name:'SPAIN',  short:'ESP',shirt:'#d02020',trim:'#ffd000',alt:'#2040a0',altTrim:'#ffd000',hair:'#241408',spd:1.00,pow:1.00,def:1.00,flag:'esp'},
 {name:'JAPAN',  short:'JPN',shirt:'#2038c0',trim:'#ffffff',alt:'#f0f0f0',altTrim:'#d02020',hair:'#101010',spd:1.10,pow:0.92,def:0.92,flag:'jpn'}
];
let SD=[TEAMS[0],TEAMS[1]]; // slot data: slot0=human, slot1=cpu (kit-resolved)
function hexRGB(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function colorDist(a,b){const A=hexRGB(a),B=hexRGB(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]);}
function resolveKits(){ // away team changes kit if colors clash -> always readable
  const h=TEAMS[human],c=TEAMS[cpu];
  let shirt=c.shirt,trim=c.trim;
  if(colorDist(h.shirt,shirt)<110){shirt=c.alt;trim=c.altTrim;}
  SD=[h,Object.assign({},c,{shirt,trim})];
}
/* Team mentality derived from stats: >0 offensive, <0 defensive */
function teamAggro(T){return (T.spd+T.pow)/2-T.def;}

function drawFlag(c,id,x,y,w,h){
  c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
  const HZ=cols=>cols.forEach((col,i)=>{c.fillStyle=col;c.fillRect(x,y+i*h/cols.length,w,h/cols.length+1);});
  const VT=cols=>cols.forEach((col,i)=>{c.fillStyle=col;c.fillRect(x+i*w/cols.length,y,w/cols.length+1,h);});
  if(id==='bra'){c.fillStyle='#009c3c';c.fillRect(x,y,w,h);c.fillStyle='#ffdf00';c.beginPath();c.moveTo(x+w/2,y+2);c.lineTo(x+w-2,y+h/2);c.lineTo(x+w/2,y+h-2);c.lineTo(x+2,y+h/2);c.fill();c.fillStyle='#003da5';c.beginPath();c.arc(x+w/2,y+h/2,h/5,0,7);c.fill();}
  else if(id==='frg')HZ(['#111','#d00','#fc0']);
  else if(id==='arg')HZ(['#79b7ff','#fff','#79b7ff']);
  else if(id==='ita')VT(['#009246','#fff','#ce2b37']);
  else if(id==='eng'){c.fillStyle='#fff';c.fillRect(x,y,w,h);c.fillStyle='#d02020';c.fillRect(x+w/2-h/6,y,h/3,h);c.fillRect(x,y+h/2-h/6,w,h/3);}
  else if(id==='fra')VT(['#0055a4','#fff','#ef4135']);
  else if(id==='esp')HZ(['#c60b1e','#ffc400','#c60b1e']);
  else if(id==='jpn'){c.fillStyle='#fff';c.fillRect(x,y,w,h);c.fillStyle='#d02020';c.beginPath();c.arc(x+w/2,y+h/2,h/3,0,7);c.fill();}
  c.restore();c.strokeStyle='#000';c.lineWidth=1;c.strokeRect(x+.5,y+.5,w-1,h-1);
}

/* ================= AUDIO (retro synth per GDD) ================= */
let AC=null,master,sfxG,musG,noiseBuf,crowdSrc=null,musicOn=true;
function initAudio(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  sfxG=AC.createGain();sfxG.gain.value=.9;sfxG.connect(master);
  musG=AC.createGain();musG.gain.value=.5;musG.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*1.5,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function tone(type,f0,t,dur,vol,f1,dest){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+.05);
}
function noiseHit(t,dur,vol,ftype,f0,f1,Q,dest){
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=ftype;f.frequency.setValueAtTime(f0,t);
  if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  f.Q.value=Q||1;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t);s.stop(t+dur+.05);
}
const now=()=>AC?AC.currentTime:0;
function sWhistle(kind){ if(!AC)return; const t=now();
  const w=(dt,dur)=>{tone('square',2300,dt,dur,.10);tone('square',2800,dt,dur,.08);};
  if(kind==='short')w(t,.12);
  else if(kind==='double'){w(t,.1);w(t+.16,.1);}
  else if(kind==='long')w(t,.55);
  else if(kind==='triple'){w(t,.4);w(t+.5,.4);w(t+1,.9);}
}
function sKick(){if(!AC)return;const t=now();noiseHit(t,.07,.5,'lowpass',500);tone('sine',150,t,.08,.35,60);}
function sShoot(){if(!AC)return;const t=now();noiseHit(t,.09,.5,'bandpass',900,300);tone('square',220,t,.12,.25,90);}
function sSlide(){if(!AC)return;noiseHit(now(),.2,.35,'bandpass',300,1400,2);}
function sBounce(v){if(!AC)return;tone('sine',200,now(),.09,.3*v,80);}
function sPost(){if(!AC)return;const t=now();tone('square',650,t,.15,.25,600);tone('triangle',1300,t,.2,.15);}
function sCatch(){if(!AC)return;tone('sine',300,now(),.05,.2);}
function sBlip(){if(!AC)return;tone('square',880,now(),.06,.15);}
function sCheer(big){ if(!AC)return; const t=now();
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=.6;
  const g=AC.createGain();g.gain.setValueAtTime(.001,t);
  g.gain.linearRampToValueAtTime(big?.5:.22,t+.15);
  g.gain.linearRampToValueAtTime(.001,t+(big?1.6:.8));
  s.connect(f);f.connect(g);g.connect(sfxG);s.start(t);s.stop(t+2);
}
function sGoalJingle(){ if(!AC)return; const t=now();
  [523,659,784,1046,1318].forEach((f,i)=>tone('square',f,t+i*.09,.16,.2));
  sCheer(true);
}
function startCrowd(){ if(!AC||crowdSrc)return;
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=500;
  const g=AC.createGain();g.gain.value=.05;
  s.connect(f);f.connect(g);g.connect(sfxG);s.start();crowdSrc=s;
}
function stopCrowd(){ if(crowdSrc){try{crowdSrc.stop()}catch(e){}crowdSrc=null;} }

/* ================= MUSIC SEQUENCER ================= */
const TITLE_LEAD=[69,0,0,0,72,0,0,0,74,0,74,0,76,0,74,0,
65,0,0,0,69,0,0,0,72,0,72,0,74,0,72,0,
67,0,0,0,71,0,0,0,74,0,74,0,76,0,79,0,
76,0,74,0,72,0,71,0,69,0,0,0,0,0,0,0];
const TITLE_BASS=(()=>{const out=[];for(const r of[45,41,43,45])out.push(r,0,r,0,r,0,r+12,0,r,0,r,0,r+7,0,r+12,0);return out;})();
const MATCH_BASS=(()=>{const out=[];for(const r of[45,45,41,43])for(let i=0;i<16;i++)out.push(i%2===0?(i%8===6?r+12:r):0);return out;})();
const Music={mode:'none',step:0,next:0,bpm:138,
  set(m){if(this.mode===m)return;this.mode=m;this.step=0;if(AC)this.next=AC.currentTime+.05;},
  tick(){ if(!AC||!musicOn||this.mode==='none')return;
    const spb=60/this.bpm/4;
    while(this.next<AC.currentTime+.12){this.play(this.step,this.next);this.step=(this.step+1)&63;this.next+=spb;} },
  play(s,t){ const mF=m=>440*Math.pow(2,(m-69)/12);
    if(this.mode==='title'){
      const n=TITLE_LEAD[s];if(n)tone('square',mF(n),t,.16,.10,0,musG);
      const b=TITLE_BASS[s];if(b)tone('triangle',mF(b),t,.18,.22,0,musG);
      if(s%2===0)noiseHit(t,.03,s%4===2?.07:.04,'highpass',6000,0,1,musG);
    }else if(this.mode==='match'){
      const b=MATCH_BASS[s];if(b)tone('triangle',mF(b),t,.16,.15,0,musG);
      if(s%2===0)noiseHit(t,.03,.03,'highpass',7000,0,1,musG);
      if(s%16===8)noiseHit(t,.1,.09,'bandpass',1800,0,1,musG);
    } }
};
setInterval(()=>Music.tick(),40);

/* ================= STATE ================= */
let state='title',human=0,cpu=1,players=[],ball={x:CX,y:640,z:0,vx:0,vy:0,vz:0,owner:null,receiver:null};
let scores=[0,0],clock=0,golden=false,controlled=null,camY=640-H/2;
let kickT=0,goalT=0,splashT=0,goalTeam=0,selPhase=0,selCur=0;
let banner={text:'',t:0,max:1},shake=0,paused=false,perfT=0;
let passTarget=null, lastOwner=-1;
const record={w:0,l:0,d:0};
const FORM=[
 {x:240,y:1240,gk:true,role:'gk'},
 {x:150,y:1060,role:'df'},{x:330,y:1060,role:'df'},
 {x:115,y:870,role:'mf'},{x:365,y:870,role:'mf'},
 {x:240,y:715,role:'fw'}
];
function makePlayers(){
  players=[];
  for(let t=0;t<2;t++)for(const f of FORM){
    const y=t===0?f.y:PH-f.y;
    players.push({team:t,gk:!!f.gk,role:f.role,x:f.x,y,ax:f.x,ay:y,vx:0,vy:0,
      dir:t===0?-Math.PI/2:Math.PI/2,anim:Math.random()*7,pickCd:0,tackleCd:0,
      lunge:0,ldx:0,ldy:0,holdT:0,aiPassCd:0,aiShootCd:0,runner:false});
  }
}
function bannerSet(t,m){banner={text:t,t:m,max:m};}
function quitToTitle(){
  paused=false;stopCrowd();Music.set('title');state='title';sBlip();
}
function beginMatch(){
  resolveKits();
  scores=[0,0];clock=0;golden=false;paused=false;passTarget=null;lastOwner=-1;
  makePlayers();Music.set('match');startCrowd();
  kickoff(Math.random()<.5?0:1);
}
function kickoff(team){
  for(const p of players){
    p.x=p.ax+(Math.random()*8-4);p.y=p.ay+(Math.random()*8-4);
    p.vx=0;p.vy=0;p.lunge=0;p.pickCd=0;p.holdT=0;p.runner=false;
    p.dir=p.team===0?-Math.PI/2:Math.PI/2;
  }
  const fw=players.find(p=>p.team===team&&p.role==='fw');
  if(fw){fw.x=CX;fw.y=team===0?654:626;}
  ball={x:CX,y:640,z:0,vx:0,vy:0,vz:0,owner:null,receiver:null};   // ball back to centre spot
  lastOwner=-1;
  state='kick';kickT=1.0;bannerSet('KICK OFF',.9);camY=640-H/2;controlled=fw;passTarget=null;
}
function goal(team){
  scores[team]++;goalTeam=team;state='goal';goalT=2.4;passTarget=null;
  bannerSet('GOAL!',2.2);shake=8;sGoalJingle();
}
function fullTime(){
  state='full';sWhistle('triple');stopCrowd();Music.set('title');passTarget=null;
  if(scores[0]>scores[1])record.w++;else if(scores[0]<scores[1])record.l++;else record.d++;
}

/* ================= INPUT ================= */
const keys={},press={};
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',
ArrowRight:'right',KeyD:'right',KeyZ:'A',KeyK:'A',Space:'A',KeyX:'B',KeyL:'B',Enter:'start',
KeyM:'music',KeyP:'pause',Escape:'pause',KeyR:'restart',KeyQ:'quit',KeyC:'change'};
addEventListener('keydown',e=>{
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  const a=KEYMAP[e.code];if(!a)return;e.preventDefault();
  if(a==='music'){musicOn=!musicOn;return;}
  if(!keys[a])press[a]=1;keys[a]=1;
});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(a)keys[a]=0;});
addEventListener('blur',()=>{if(state==='play'||state==='kick')paused=true;});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  const dn=e=>{e.preventDefault();initAudio();if(AC&&AC.state==='suspended')AC.resume();if(!keys[k])press[k]=1;keys[k]=1;};
  const up=e=>{e.preventDefault();keys[k]=0;};
  b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);
});
let inp={x:0,y:0};
function readInput(){
  let ix=(keys.right?1:0)-(keys.left?1:0),iy=(keys.down?1:0)-(keys.up?1:0);
  const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l;}
  inp={x:ix,y:iy};
}

/* ================= GAMEPLAY ================= */
function seek(p,tx,ty){const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);if(d<6)return{x:0,y:0};return{x:dx/d,y:dy/d};}
function nearestOpp(p){let b=null,bd=1e9;for(const o of players)if(o.team!==p.team){const d=dist(p.x,p.y,o.x,o.y);if(d<bd){bd=d;b=o;}}return b;}
function kickTo(p,tx,ty,sp,vz){
  const n=norm(tx-p.x,ty-p.y);
  ball.owner=null;
  ball.x=p.x+n.x*10;ball.y=p.y+n.y*10;
  ball.vx=n.x*sp;ball.vy=n.y*sp;ball.z=Math.max(ball.z,2);ball.vz=vz;
  p.pickCd=.4;p.dir=Math.atan2(n.y,n.x);
}
/* Best pass candidate for holder p (forward, free of opponents, in range) */
function findPassTarget(p){
  let best=null,bs=-1e9;
  for(const m of players)if(m!==p&&m.team===p.team&&!m.gk){
    const d=dist(p.x,p.y,m.x,m.y);if(d<40||d>360)continue;
    const fwd=p.team===0?(p.y-m.y):(m.y-p.y);
    let free=1e9;for(const o of players)if(o.team!==p.team)free=Math.min(free,dist(m.x,m.y,o.x,o.y));
    const s=fwd+free*.9-d*.35;
    if(s>bs){bs=s;best=m;}
  }
  return best;
}
function doPass(p){
  const best=(p.team===0&&passTarget)?passTarget:findPassTarget(p); // pass goes to the blinking mate
  sKick();
  if(best){
    const t=dist(p.x,p.y,best.x,best.y)/250;
    kickTo(p,best.x+best.vx*t*.7,best.y+best.vy*t*.7,250,26);
    ball.receiver=best; // receiver runs to the ball to collect it
  }else{
    kickTo(p,p.x+(Math.random()*80-40),p.team===0?GT:GB,250,40);
    ball.receiver=null;
  }
}
function doShoot(p){
  const gy=p.team===0?GT-20:GB+20;
  const spread=p.team===1?45*DIFFS[diffIdx].err:45; // CPU aim accuracy by difficulty
  kickTo(p,CX+(Math.random()*spread*2-spread),gy,300*SD[p.team].pow+Math.random()*30,90+Math.random()*40);
  ball.receiver=null;
  sShoot();if(dist(p.x,p.y,CX,gy)<300)sCheer(false);
  p.aiShootCd=1.2;
}
function doTackle(p){
  let dx,dy;
  if(p===controlled&&(inp.x||inp.y)){dx=inp.x;dy=inp.y;}
  else if(ball.owner&&ball.owner!==p){dx=ball.owner.x-p.x;dy=ball.owner.y-p.y;}
  else{dx=ball.x-p.x;dy=ball.y-p.y;}
  const n=norm(dx,dy);
  p.ldx=n.x;p.ldy=n.y;p.lunge=.22;p.tackleCd=.7;sSlide();
}
function computeControlled(){
  if(ball.owner&&ball.owner.team===0){controlled=ball.owner;return;}
  let best=null,bd=1e9;
  for(const p of players)if(p.team===0&&!p.gk){const d=dist(p.x,p.y,ball.x,ball.y);if(d<bd){bd=d;best=p;}}
  if(controlled&&controlled.team===0&&!controlled.gk&&controlled!==best){
    if(dist(controlled.x,controlled.y,ball.x,ball.y)<bd+20)best=controlled;
  }
  controlled=best;
}
function updatePlay(dt,live){
  const D=DIFFS[diffIdx];
  if(live){
    clock+=dt;
    if(clock>=MATCH_LEN&&!golden){
      if(scores[0]!==scores[1]){fullTime();return;}
      golden=true;bannerSet('GOLDEN GOAL!',2);sWhistle('long');
    }
  }
  computeControlled();
  /* blinking pass target while the human holder dribbles */
  passTarget=(live&&ball.owner&&ball.owner.team===0)?findPassTarget(ball.owner):null;
  /* pick the 2nd offensive runner (nearest MF) when possession changes */
  const ownerTeam=ball.owner?ball.owner.team:-1;
  if(ownerTeam!==lastOwner){
    for(const q of players)q.runner=false;
    if(ownerTeam>=0){
      let bm=null,bd=1e9;
      for(const q of players)if(q.team===ownerTeam&&q.role==='mf'){const d=dist(q.x,q.y,ball.x,ball.y);if(d<bd){bd=d;bm=q;}}
      if(bm)bm.runner=true;
    }
    lastOwner=ownerTeam;
  }
  /* holder driving at goal -> defenders jockey & hesitate instead of diving */
  const holderNearGoal=ball.owner?(ball.owner.team===0?ball.y<GT+380:ball.y>GB-380):false;
  const chaser=[null,null];
  for(let t=0;t<2;t++)if(!(ball.owner&&ball.owner.team===t)){
    let bd=1e9;for(const p of players)if(p.team===t&&!p.gk){const d=dist(p.x,p.y,ball.x,ball.y);if(d<bd){bd=d;chaser[t]=p;}}
  }
  for(const p of players){
    p.pickCd-=dt;p.tackleCd-=dt;p.lunge-=dt;p.aiPassCd-=dt;p.aiShootCd-=dt;
    const isCtl=live&&p===controlled&&p.team===0;
    let mx=0,my=0;
    if(isCtl){mx=inp.x;my=inp.y;}
    else{
      const owns=ball.owner===p;
      if(owns&&p.team===1){
        let d=norm(CX-p.x,GB+20-p.y);
        const opp=nearestOpp(p);
        if(opp&&dist(p.x,p.y,opp.x,opp.y)<55){const aw=norm(p.x-opp.x,p.y-opp.y);d=norm(d.x+aw.x*D.avoid,d.y+aw.y*D.avoid);}
        mx=d.x;my=d.y;
        if(opp&&dist(p.x,p.y,opp.x,opp.y)<40&&p.aiPassCd<=0&&Math.random()<.08*D.react){p.aiPassCd=1;doPass(p);}
        else if(dist(p.x,p.y,CX,GB)<D.range&&p.aiShootCd<=0&&Math.random()<.06*D.react)doShoot(p);
      }
      else if(p.gk){
        if(!owns){
          let tx=clamp(ball.x+ball.vx*.15,CX-55,CX+55),ty=p.team===0?GB-8:GT+8;
          const inBox=p.team===0?(ball.y>GB-140):(ball.y<GT+140);
          if(!ball.owner&&Math.abs(ball.x-CX)<110&&inBox){tx=ball.x;ty=ball.y;}
          const s=seek(p,tx,ty);mx=s.x;my=s.y;
        }
      }
      else if(!ball.owner&&p===ball.receiver){
        /* designated receiver runs to the incoming pass */
        const s=seek(p,ball.x+ball.vx*.25,ball.y+ball.vy*.25);mx=s.x;my=s.y;
      }
      else if(p===chaser[p.team]){
        /* defender holds & mirrors the holder near his own goal instead of lunging through */
        if(p.team===1&&holderNearGoal&&ball.owner&&dist(p.x,p.y,ball.x,ball.y)<50){mx=0;my=0;}
        else{
          const L=p.team===1?D.lead:.2;
          const s=seek(p,ball.x+ball.vx*L,ball.y+ball.vy*L);mx=s.x;my=s.y;
        }
      }
      else{
        /* ===== TEAM SHAPE: 2 offensive runners + 2 defensive stayers ===== */
        const T=SD[p.team],aggro=teamAggro(T);
        const ownB=ball.owner&&ball.owner.team===p.team;
        const oppB=ball.owner&&ball.owner.team!==p.team;
        const dir=p.team===0?-1:1;
        let tx=clamp(p.ax+(ball.x-CX)*.18,20,PW-20);
        let ty;
        if(ownB){
          if(p.role==='fw'||p.runner){
            /* OFFENSIVE RUNNER: attacks the goal in a lane, gets beyond the ball */
            tx=clamp(CX+(p.ax>=CX?70:-70)+(ball.x-CX)*.2,30,PW-30);
            ty=p.team===0?Math.min(ball.y-140,p.ay-260):Math.max(ball.y+140,p.ay+260);
          }else if(p.role==='df'){
            /* DEFENSIVE STAYER: holds own half while team attacks */
            ty=p.ay+(ball.y-640)*.15;
            if(p.team===0)ty=Math.max(ty,760);else ty=Math.min(ty,520);
          }else{
            /* remaining midfielder: link-up support */
            ty=p.ay+(ball.y-640)*.45+dir*(150+aggro*700)*.6;
          }
        }else if(oppB){
          const push=-dir*(120-aggro*500);
          ty=p.ay+(ball.y-640)*.25+push;
          if(holderNearGoal&&p.role==='df'){
            /* goal-side jockey position between holder and goal, mirrors holder's x */
            tx=clamp(CX+(ball.x-CX)*.6,CX-GOAL_HW-20,CX+GOAL_HW+20);
            ty=p.team===1?GT+70:GB-70;
          }
        }else{
          ty=p.ay+(ball.y-640)*.25;
        }
        ty=clamp(ty,GT+10,GB-10);
        const s=seek(p,tx,ty);mx=s.x;my=s.y;
      }
    }
    /* SPEED RULES: ball carrier is always the fastest; supporting mates never outrun him */
    let sp;
    if(isCtl)sp=(ball.owner===p)?140:132;
    else if(p.gk)sp=150;
    else sp=118*SD[p.team].spd;
    if(!isCtl&&p.team===0&&ball.owner&&ball.owner.team===0)sp=Math.min(sp,124);
    if(p.team===1)sp*=D.spd;
    if(p.lunge>0){p.vx=p.ldx*300;p.vy=p.ldy*300;}
    else{
      const k=Math.min(1,dt*8);
      p.vx+=(mx*sp-p.vx)*k;p.vy+=(my*sp-p.vy)*k;
    }
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.gk)p.y=p.team===0?clamp(p.y,GB-70,GB-2):clamp(p.y,GT+2,GT+70);
    else p.y=clamp(p.y,GT+2,GB-2);
    p.x=clamp(p.x,10,PW-10);
    const s2=Math.hypot(p.vx,p.vy);
    if(s2>6){p.dir=Math.atan2(p.vy,p.vx);p.anim+=s2*dt*.12;}
  }
  if(live){
    const p=controlled;
    if(p&&p.team===0){
      if(press.A){ if(ball.owner===p)doPass(p); else if(p.tackleCd<=0)doTackle(p); }
      if(press.B){ if(ball.owner===p)doShoot(p); else if(p.tackleCd<=0)doTackle(p); }
    }
    if(ball.owner&&ball.owner.team===0){
      const reach=24+8*D.react;
      const waitF=holderNearGoal?.5:1; // CPU hesitates when you reach their goal
      for(const q of players)if(q.team===1&&!q.gk&&q.tackleCd<=0&&dist(q.x,q.y,ball.owner.x,ball.owner.y)<reach&&Math.random()<.05*D.react*waitF)doTackle(q);
    }
    if(ball.owner)
      for(const q of players)if(q.lunge>0&&q.team!==ball.owner.team&&dist(q.x,q.y,ball.owner.x,ball.owner.y)<18){
        q.tackleCd=.7;
        const base=q.team===1?D.steal:.45;
        if(Math.random()<base+SD[q.team].def*.25){
          ball.owner.pickCd=.5;ball.owner=null;ball.receiver=null;
          ball.vx=(Math.random()-.5)*120;ball.vy=(Math.random()-.5)*120;ball.z=0;ball.vz=0;
          sKick();sCheer(false);
        }
      }
  }
  updateBall(dt,live);
  const target=clamp(ball.y-H/2,0,PH-H);
  camY+=(target-camY)*Math.min(1,dt*6);
}
function updateBall(dt,live){
  const D=DIFFS[diffIdx];
  const b=ball;
  if(b.owner){
    const o=b.owner;o.holdT+=dt;b.receiver=null;
    const dx=Math.cos(o.dir),dy=Math.sin(o.dir);
    b.x=o.x+dx*11;b.y=o.y+dy*11;b.z=0;b.vx=o.vx;b.vy=o.vy;b.vz=0;
    if(live&&o.gk&&o.holdT>.9){
      const tx=60+Math.random()*360;
      const ty=o.team===0?400+Math.random()*250:PH-400-Math.random()*250;
      kickTo(o,tx,ty,260,170);sKick();
    }
    return;
  }
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  const f=Math.pow(.5,dt/1.4);b.vx*=f;b.vy*=f;
  if(b.z>0||b.vz!==0){
    b.z+=b.vz*dt;b.vz-=500*dt;
    if(b.z<=0){b.z=0;if(b.vz<-70){sBounce(Math.min(1,-b.vz/400));b.vz=-b.vz*.5;}else b.vz=0;}
  }
  if(b.x<10){b.x=10;b.vx=Math.abs(b.vx)*.6;sBounce(.4);}
  if(b.x>PW-10){b.x=PW-10;b.vx=-Math.abs(b.vx)*.6;sBounce(.4);}
  if(b.y<GT){
    if(Math.abs(b.x-CX)<GOAL_HW&&live){goal(0);return;}
    if(b.y<6){b.y=6;b.vy=Math.abs(b.vy)*.5;}
    else{b.vy=Math.abs(b.vy)*.6;if(Math.abs(b.x-CX)<GOAL_HW+12){sPost();shake=Math.max(shake,4);}}
  }
  if(b.y>GB){
    if(Math.abs(b.x-CX)<GOAL_HW&&live){goal(1);return;}
    if(b.y>PH-6){b.y=PH-6;b.vy=-Math.abs(b.vy)*.5;}
    else{b.vy=-Math.abs(b.vy)*.6;if(Math.abs(b.x-CX)<GOAL_HW+12){sPost();shake=Math.max(shake,4);}}
  }
  if(!live)return;
  if(b.z<26){
    let best=null,bd=1e9;
    for(const p of players){
      if(p.pickCd>0)continue;
      const r=p.gk?(p.team===1?D.gk:17):(p===b.receiver?16:(p.lunge>0?16:11)); // receiver gets a clean first touch
      const d=dist(p.x,p.y,b.x,b.y);
      if(d<r&&d<bd){bd=d;best=p;}
    }
    if(best){
      const spd=Math.hypot(b.vx,b.vy);
      if(best!==b.receiver&&!best.gk&&spd>330&&Math.random()<.5){
        b.vx=b.vx*-.25+(Math.random()-.5)*60;b.vy=b.vy*-.25+(Math.random()-.5)*60;sBounce(.5);
      }else{b.owner=best;best.holdT=0;b.receiver=null;sCatch();}
    }
  }
}

function drawPlayer(p){
  /* sprite size comes ONLY from the PR constant: identical for every player & difficulty */
  const T=SD[p.team],x=Math.round(p.x),y=Math.round(p.y);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y+PR-2,8,3.5,0,0,7);ctx.fill();
  const ang=p.dir,px=Math.cos(ang+Math.PI/2),py=Math.sin(ang+Math.PI/2);
  const step=Math.sin(p.anim)*2.5*(Math.hypot(p.vx,p.vy)>10?1:0);
  ctx.fillStyle=T.trim;
  ctx.beginPath();ctx.arc(x+px*5+Math.cos(ang)*step,y+py*5+Math.sin(ang)*step,2.5,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x-px*5-Math.cos(ang)*step,y-py*5-Math.sin(ang)*step,2.5,0,7);ctx.fill();
  ctx.fillStyle=T.shirt;ctx.beginPath();ctx.arc(x,y,PR,0,7);ctx.fill();
  ctx.strokeStyle=T.trim;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,PR,0,7);ctx.stroke();
  ctx.fillStyle=T.hair;ctx.beginPath();ctx.arc(x,y-1,PR-2.5,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(x-1.5,y-2.5,1.5,0,7);ctx.fill();
  if(p===controlled&&p.team===0&&(state==='play'||state==='kick')){
    const b=Math.sin(perfT*8)*2;
    ctx.fillStyle='#ffe000';
    ctx.beginPath();ctx.moveTo(x,y-16+b);ctx.lineTo(x-5,y-23+b);ctx.lineTo(x+5,y-23+b);ctx.fill();
  }
  /* blinking ring = ready to receive the pass */
  if(p===passTarget&&state==='play'&&Math.floor(perfT*8)%2===0){
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,y,PR+4,0,7);ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.moveTo(x,y-14);ctx.lineTo(x-4,y-19);ctx.lineTo(x+4,y-19);ctx.fill();
  }
}

  ctx.fillStyle=SD[1].shirt;ctx.fillText(SD[1].short,W/2+90,195);
  ctx.font='8px "Press Start 2P", monospace';
  ctx.fillStyle=scores[0]>scores[1]?'#7dff7d':'#ff5050';
  ctx.fillText(scores[0]>scores[1]?'YOU WIN!':'YOU LOSE',W/2,230);
  ctx.fillStyle='#ffd800';ctx.fillText('RECORD  W'+record.w+' L'+record.l,W/2,258);
  if(Math.floor(perfT*2)%2===0){
    ctx.fillStyle='#fff';
    ctx.fillText('ENTER REMATCH',W/2,288);
    ctx.fillText('C TEAMS   Q TITLE',W/2,304);
  }
}
function drawPause(){
  ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#101038';ctx.fillRect(110,110,260,200);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(110,110,260,200);
  ctx.textAlign='center';
  ctx.font='16px "Press Start 2P", monospace';
  ctx.fillStyle='#fff';ctx.fillText('PAUSE',W/2,152);
  ctx.font='8px "Press Start 2P", monospace';
  ctx.fillStyle='#7dff7d';ctx.fillText('ENTER / P  RESUME',W/2,200);
  ctx.fillStyle='#ffd800';ctx.fillText('R  RESTART MATCH',W/2,232);
  ctx.fillStyle='#ff5050';ctx.fillText('Q  QUIT TO TITLE',W/2,264);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(state==='title'){renderTitle();return;}
  if(state==='select'){renderSelect();return;}
  if(state==='splash'){renderSplash();return;}
  const ox=shake>0?Math.round((Math.random()-.5)*shake):0;
  const oy=shake>0?Math.round((Math.random()-.5)*shake):0;
  ctx.save();ctx.translate(ox,Math.round(-camY)+oy);
  ctx.drawImage(fieldC,0,0);
  const ps=[...players].sort((a,b)=>a.y-b.y);
  for(const p of ps)drawPlayer(p);
  drawBall();
  ctx.restore();
  drawHUD();
  drawBanner();
  if(state==='full')renderFull();
  if(paused)drawPause();
}

/* ================= MAIN LOOP ================= */
function updateSelect(){
  if(press.left){selCur=(selCur+7)%8;sBlip();}
  if(press.right){selCur=(selCur+1)%8;sBlip();}
  if(press.up||press.down){selCur=(selCur+4)%8;sBlip();}
  if(press.quit){quitToTitle();return;}
  if(press.start){
    if(selPhase===0){human=selCur;selPhase=1;selCur=(human+1+((Math.random()*6)|0))%8;sBlip();}
    else{
      cpu=selCur;if(cpu===human)cpu=(cpu+1)%8;
      resolveKits();
      state='splash';splashT=1.6;Music.set('match');startCrowd();sWhistle('short');
    }
  }
}
function update(dt){
  if(banner.t>0)banner.t-=dt;
  if(shake>0)shake=Math.max(0,shake-dt*30);
  if(state==='title'){
    if(press.up||press.down){menuCur=1-menuCur;sBlip();}
    else if(menuCur===1&&(press.left||press.right||press.start)){
      diffIdx=(diffIdx+(press.left?2:1))%3;sBlip();
    }
    else if(menuCur===0&&press.start){state='select';selPhase=0;selCur=0;Music.set('title');sBlip();}
    return;
  }
  if(state==='select'){updateSelect();return;}
  if(state==='splash'){splashT-=dt;if(splashT<=0)beginMatch();return;}
  if(state==='full'){
    if(press.start)beginMatch();
    else if(press.change){state='select';selPhase=0;selCur=0;Music.set('title');sBlip();}
    else if(press.quit)quitToTitle();
    return;
  }
  if(state==='goal'){
    goalT-=dt;
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=.9;ball.vy*=.9;
    ball.y=clamp(ball.y,6,PH-6);
    if(goalT<=0){ if(golden)fullTime(); else kickoff(1-goalTeam); } // conceding team kicks off from centre
    return;
  }
  if(state==='play'||state==='kick'){
    if(!paused&&(press.pause||press.start)){paused=true;sBlip();}
    else if(paused){
      if(press.pause||press.start){paused=false;sBlip();}
      else if(press.restart){paused=false;beginMatch();}
      else if(press.quit)quitToTitle();
    }
  }
  if(paused)return;
  if(state==='kick'){kickT-=dt;if(kickT<=0){state='play';sWhistle('short');}}
  updatePlay(dt,state==='play');
}
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;perfT+=dt;
  readInput();
  update(dt);
  render();
  for(const k in press)delete press[k];
}
function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  const sc=s<1?s:Math.floor(s*2)/2;
  cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';
}
addEventListener('resize',resize);
if(document.fonts)['8px','16px','24px','32px'].forEach(s=>document.fonts.load(s+' "Press Start 2P"'));
resize();
requestAnimationFrame(loop);
</script>
